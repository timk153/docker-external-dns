name: Continous Integration
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  checks: write
  pull-requests: write
jobs:
  quality_gateway:
    name: Quality Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
      - uses: Amadevus/pwsh-script@97a8b211a5922816aa8a69ced41fa32f23477186
        name: "Docker: generating quality reports (testing & linting)"
        id: script
        with:
          script: |
            $identity = New-Guid
            $name = "docker-compose-external-dns.quality.$identity"
            $amd64 = "$name.amd64"
            $arm64 = "$name.arm64"

            mkdir output
            mkdir output/reports

            docker build --platform linux/amd64 --target tests --tag $amd64 .
            docker run --platform linux/amd64 -u root -v /var/run/docker.sock:/var/run/docker.sock --name $amd64 -a stdin -a stdout -a stderr $amd64
            docker cp "$($amd64):/app/src" "./output/src"
            docker cp "$($amd64):/app/reports" "./output/reports/amd64"
            docker container rm $amd64
            docker image rm $amd64

            docker build --platform linux/arm64 --target tests --tag $arm64 .
            docker run --platform linux/arm64 -u root -v /var/run/docker.sock:/var/run/docker.sock --name $arm64 -a stdin -a stdout -a stderr $arm64
            docker cp "$($arm64):/app/reports" "./output/reports/arm64"
            docker container rm $arm64
            docker image rm $arm64
      - uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe
        name: Publish Test Report
        if: success() || failure()
        with:
          report_paths: "./output/reports/*/*junit*.xml"
          fail_on_failure: true
          include_passed: true
      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          api-token: ${{ secrets.CODACY_TOKEN }}
          coverage-reports: "output/reports/amd64/*cobertura*.xml"
      - uses: gaelgirodon/ci-badges-action@e2b7770c45a7c4be54af8b4b046afdeb09898dc4
        name: Generate CI badges
        if: github.ref == 'refs/heads/main'
        with:
          gist-id: 26bea053b867128f6f37f5aac0ddcf8b
          token: ${{ secrets.GIST_TOKEN }}
