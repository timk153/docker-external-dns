permissions: {}
name: Publish to DockerHub
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.compute-versions.outputs.result }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        name: Checkout
        with:
          fetch-depth: 0
      - uses: Amadevus/pwsh-script@97a8b211a5922816aa8a69ced41fa32f23477186
        name: "Compute versions"
        id: compute-versions
        with:
          script: |
            $gitVersion = git describe --tags
            $latestMajorTag = ''
            $latestTag = ''
            if ($gitVersion -match '^\d+.\d+.\d+$') {
              # get all tags in semver order oldest to newest
              $tags = git tag -l --sort=version:refname  | Where-Object { $_ -Match '^\d+\.\d+\.\d+$' }
              # get the latest released semver
              $latestVersion = ($tags.Count -eq 1) ? $tags : $tags[$tags.Count - 1]
              # get the latest released semver for the tag being processed
              $majorVersionMatch =  $gitVersion | Select-String -Pattern '^\d+(?=\.)'
              $majorVersion = $majorVersionMatch.Matches[0].Value
              # get latest for this major version
              $latestMajorVersion = $tags | Where-Object { $_ -Match "^$($majorVersion)(?=\.)" } | Select-Object -Last 1
              # compute latest tag
              if([version]$gitVersion -ge [version]$latestMajorVersion) {
                # it's equal to or greater than
                # add latest tag to output
                $latestMajorTag = "timk153/docker-external-dns:$($majorVersion)-latest"
              }
              if([version]$gitVersion -ge [version]$latestVersion) {
                $latestTag = 'timk153/docker-external-dns:latest'
              }
            }
            $gitTag = "timk153/docker-external-dns:$($gitVersion)"
            return ConvertTo-Json -InputObject @($gitTag, $latestMajorTag, $latestTag) -Compress

  # Matrix jobs share output names, so their digests can overwrite each other.
  # Keep one job per platform to expose a distinct digest to the manifest job.
  publish-amd64:
    name: Publish amd64
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        name: Checkout
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        name: Set up Docker Buildx
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        name: Login to Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=timk153/docker-external-dns,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  publish-arm64:
    name: Publish arm64
    needs: prepare
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        name: Checkout
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        name: Set up Docker Buildx
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        name: Login to Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=timk153/docker-external-dns,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  create-manifest:
    name: Create multi-platform manifest
    needs:
      - prepare
      - publish-amd64
      - publish-arm64
    if: ${{ needs.publish-amd64.outputs.digest != '' && needs.publish-arm64.outputs.digest != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
        name: Set up Docker Buildx
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        name: Login to Docker Hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create and push manifest
        env:
          IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
          AMD64_DIGEST: ${{ needs.publish-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.publish-arm64.outputs.digest }}
        run: |
          image_tag_args() {
            jq -r '.[] | "--tag\n" + .' <<< "$1"
          }
          mapfile -t image_tags < <(image_tag_args "$IMAGE_TAGS")

          docker buildx imagetools create \
            "${image_tags[@]}" \
            "timk153/docker-external-dns@$AMD64_DIGEST" \
            "timk153/docker-external-dns@$ARM64_DIGEST"
